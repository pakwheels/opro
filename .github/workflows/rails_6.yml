name: Rails 6 test

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      RAILS_VERSION: 6.0.6.1
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.7.8
          bundler: 2.4.22
      - run: bundle install
      - run: bundle exec rake test
